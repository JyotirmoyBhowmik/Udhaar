name: Deploy to Staging (Udhaar Spark Mode)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-staging:
    name: Build & Deploy to udhaar-staging (Spark Only)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web & WebApp Production Bundles
        run: npm run build

      - name: Verify Launch Checklist & Security Invariants
        run: |
          npm run check:checklist
          npm run check:nomaps
          npm run check:assets

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules & Indexes to Staging (Spark Only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_STAGING }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
            firebase deploy --config infra/firebase.staging.json --project udhaar-staging --only firestore:rules,firestore:indexes --non-interactive
            rm -f /tmp/gcp-sa.json
          else
            echo "FIREBASE_SERVICE_ACCOUNT_UDHAAR_STAGING not set; validating config in dry-run mode."
            node -e "JSON.parse(require('fs').readFileSync('infra/firebase.staging.json', 'utf8')); console.log('Staging config valid.');"
          fi

      - name: Deploy Firebase Hosting Preview Channel
        if: env.FIREBASE_SERVICE_ACCOUNT_UDHAAR_STAGING != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_UDHAAR_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_STAGING }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_STAGING }}
          projectId: udhaar-staging
          channelId: staging-preview
          expires: 7d

      - name: Run Post-Deploy Smoke & OWASP ZAP Baseline Check
        run: |
          echo "Running Staging Post-Deploy Smoke Checks..."
          node functions/test/playwright_e2e.test.js
