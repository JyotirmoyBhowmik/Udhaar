name: Udhaar Production Staged Rollout & Release

on:
  workflow_dispatch:
    inputs:
      canary_percentage:
        description: 'Production Canary Rollout Percentage (5, 25, 100)'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '25'
          - '100'
      release_tag:
        description: 'Semantic Release Tag (e.g. v21.0.0)'
        required: true
        default: 'v21.0.0'
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-flight-checks:
    name: Production Release Pre-Flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm --prefix functions ci --ignore-scripts || npm --prefix functions install --ignore-scripts

      - name: Run Full Test Matrix
        run: npm test
        env:
          UDHAAR_SERVER_SECRET: "prod_preflight_secret_verification_key_32"

      - name: Build Web & WebApp Assets
        run: npm run build

  production-staged-rollout:
    name: Canary Deploy (${{ github.event.inputs.canary_percentage }}%)
    needs: pre-flight-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://app.udhaar.jyotirmoyb.com
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud / Firebase
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_PROD != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        env:
          FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      - name: Deploy Functions v2 & Security Rules to Production
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_PROD != '' }}
        run: |
          firebase deploy --only functions:api,firestore:rules,storage:rules --config infra/firebase.prod.json --project udhaar-prod --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Hosting Canary / Live Target
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT_PROD != '' }}
        run: |
          PERCENTAGE="${{ github.event.inputs.canary_percentage }}"
          if [ "$PERCENTAGE" = "100" ]; then
            echo "Promoting to 100% General Availability..."
            firebase deploy --only hosting --config infra/firebase.prod.json --project udhaar-prod --non-interactive
          else
            echo "Deploying $PERCENTAGE% Canary Channel..."
            firebase hosting:channel:deploy "canary-${{ github.event.inputs.release_tag }}" --config infra/firebase.prod.json --project udhaar-prod --expires 7d
          fi

      - name: Automated Post-Deploy Smoke Test & SLO Assertion
        run: |
          echo "Running healthcheck assertions..."
          node scripts/rollback.js --verify-canary --percentage ${{ github.event.inputs.canary_percentage }}
