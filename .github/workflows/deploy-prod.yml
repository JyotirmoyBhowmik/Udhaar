name: Deploy to Production (Udhaar Spark Mode — Canary & Live)

on:
  workflow_dispatch:
    inputs:
      canary_percentage:
        description: 'Initial canary traffic percentage (default 10%)'
        required: false
        default: '10'
      promote_to_100:
        description: 'Promote directly to 100% live after canary verification'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  build-and-precheck:
    name: Pre-Production Audit & Build (Spark Mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run full test & conformance gate
        run: |
          npm run check:checklist
          npm run check:nomaps
          npm run check:assets
          npm --prefix functions test
          node sync-conformance/ts-runner.js

      - name: Build production web & webapp bundles
        run: npm run build

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-web-bundles
          path: |
            web/
            webapp/dist/
          retention-days: 7

  deploy-production-canary:
    name: Production Canary Rollout (Manual Approval Gate — Spark Only)
    needs: build-and-precheck
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://udhaar.jyotirmoyb.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: prod-web-bundles

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules & Indexes to Production (Spark Only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-prod-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-prod-sa.json
            firebase deploy --config infra/firebase.prod.json --project udhaar-prod --only firestore:rules,firestore:indexes --non-interactive
            rm -f /tmp/gcp-prod-sa.json
          else
            echo "Running in dry-run validation mode."
            node -e "JSON.parse(require('fs').readFileSync('infra/firebase.prod.json', 'utf8')); console.log('Prod config validated.');"
          fi

      - name: Deploy Hosting Canary Channel (${{ inputs.canary_percentage || '10' }}% Traffic)
        if: env.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD }}
          projectId: udhaar-prod
          channelId: canary
          expires: 7d

      - name: Execute Canary Health Verification & Rollback Guard
        run: |
          echo "Verifying canary health metrics..."
          node scripts/rollback.js --dry-run --target=canary --reason="Post-deploy automated rollback readiness check"

      - name: Promote to 100% Live Channel
        if: ${{ inputs.promote_to_100 == true && env.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD }}
          projectId: udhaar-prod
          channelId: live
