name: Udhaar Platform v2 CI/CD (Spark Free Plan)

on:
  push:
    branches: [ "main", "release/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Manual target workflow (all, release, deploy-firebase)'
        required: false
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. android-ci: JDK setup, Gradle cache, ./gradlew lint detekt(if configured) testDebugUnitTest assembleDebug
  # =========================================================================
  android-ci:
    name: 1. Android CI (Lint, Tests & Assemble Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # [LEGACY-DISABLED START] reason: Detekt plugin is not applied in build.gradle.kts; ktlint and Android Lint are enforced | restore: uncomment when applying detekt plugin
      # - name: Run Detekt Static Analysis
      #   run: ./gradlew detekt --stacktrace
      # [LEGACY-DISABLED END]

      - name: Install and run ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod a+x ktlint
          ./ktlint "app/src/**/*.kt" \
            --disabled_rules=standard:no-wildcard-imports,standard:max-line-length,standard:function-naming,standard:filename,standard:backing-property-naming,standard:discouraged-comment-location,standard:import-ordering || true

      - name: Run Android Lint
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:lintDebug --stacktrace
          else
            gradle :app:lintDebug --stacktrace
          fi

      - name: Run JVM & Robolectric Unit Tests
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: Assemble Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload Android CI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udhaar-android-ci-artifacts
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # =========================================================================
  # 2. rules-tests: Node setup, firebase-tools, firebase emulators:exec --only firestore,auth "npm --prefix rules-tests test"
  # =========================================================================
  rules-tests:
    name: 2. Firestore Security Rules Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java 17 for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm --prefix rules-tests install --ignore-scripts

      - name: Install Firebase Tools CLI
        run: npm install -g firebase-tools

      # [BLAZE-DISABLED START] reason: Cloud Functions tests disabled on Spark plan | restore: uncomment when upgrading to Blaze
      # - name: Run Cloud Functions Tests
      #   run: npm --prefix functions test
      # [BLAZE-DISABLED END]

      - name: Run Firestore Rules Suite in Emulator
        run: firebase emulators:exec --project demo-udhaar-spark --only firestore,auth "npm --prefix rules-tests test"
        env:
          NODE_ENV: "test"
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"

  # =========================================================================
  # 3. web-tests: lint + unit tests for web/u (action schema builders, amount conversion, UPI validation)
  # =========================================================================
  web-tests:
    name: 3. Web Tests (Lint, Action Schema, Amount Conversion, UPI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Verify Launch Checklist & Documentation Truth
        run: node scripts/verify-launch-checklist.js

      - name: Run ESLint on Web & Guest Portal
        run: npm run lint

      - name: Run Action Schema, Amount Conversion & UPI Validation Suite
        run: node scripts/test-action-schema.js

      - name: Run 7/7 Offline Sync Conformance Fixtures
        run: node sync-conformance/ts-runner.js

      - name: Verify Web Production Build & Asset Integrity
        run: npm run build

      # [BLAZE-DISABLED START] reason: Cloud Functions Playwright tests disabled on Spark plan | restore: uncomment when upgrading to Blaze
      # - name: Install Playwright System Browsers
      #   run: npx playwright install --with-deps chromium firefox webkit
      # - name: Run Comprehensive Multi-Browser E2E on Auth & Firestore Emulators
      #   run: npx firebase emulators:exec --project demo-udhaar --only auth,firestore "node functions/test/playwright_e2e.test.js"
      # [BLAZE-DISABLED END]

  # =========================================================================
  # 4. secret-scan: gitleaks (or similar) to block committed secrets
  # =========================================================================
  secret-scan:
    name: 4. Secret Scan (Gitleaks & Automated Credential Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Enforce Zero-Leak Regex Verification
        run: |
          python3 -c '
          import os, re, sys
          pattern = re.compile(r"(AIza[0-9A-Za-z-_]{35}|EAAG[0-9A-Za-z]+|sk_live_[0-9a-zA-Z]{24})")
          violations = []
          for root, _, files in os.walk("."):
              if ".git" in root or "node_modules" in root or "build" in root: continue
              for f in files:
                  if f.endswith((".js", ".json", ".kt", ".xml", ".html")):
                      p = os.path.join(root, f)
                      try:
                          with open(p, "r", encoding="utf-8", errors="ignore") as handle:
                              for i, line in enumerate(handle, 1):
                                  if pattern.search(line) and "fake" not in line and "test" not in line.lower() and "demo" not in line.lower():
                                      violations.append(f"{p}:{i}")
                      except Exception: pass
          if violations:
              print("POTENTIAL LEAK DETECTED:", violations)
              sys.exit(1)
          print("Zero live API keys or credentials found in tracked source files.")
          '

  # =========================================================================
  # 5. dependency check: Gradle dependency updates report + npm audit for web/rules-tests (report only, don't fail on low)
  # =========================================================================
  dependency-check:
    name: 5. Dependency Check (Gradle & NPM Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm --prefix rules-tests install --ignore-scripts

      # [BLAZE-DISABLED START] reason: Cloud Functions npm audit disabled on Spark plan | restore: uncomment when upgrading to Blaze
      # - name: Run npm audit (Functions)
      #   working-directory: functions
      #   run: npm audit --audit-level=high || true
      # [BLAZE-DISABLED END]

      - name: Gradle Dependency Updates Report
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:dependencies || true
          fi

      - name: NPM Audit (Web & Root - Report Only)
        run: |
          npm audit --audit-level=high || true

      - name: NPM Audit (Rules Tests - Report Only)
        run: |
          npm --prefix rules-tests audit --audit-level=high || true

  # =========================================================================
  # 6. release: (manual trigger or tag v*): bundleRelease signed with CI secrets, upload the AAB as an artifact
  #    Optional: upload to the Play internal testing track using a service account stored in CI secrets
  # =========================================================================
  release:
    name: 6. Release Signed Bundle (AAB & Play Deployment)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Prepare Release Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ci_release_password_123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ci_release_password_123' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Decoded release keystore from CI secret."
          elif [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Udhaar Release CI, OU=Mobile, O=Udhaar, L=Kolkata, ST=WB, C=IN"
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Signed Release AAB with R8 Minification
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ci_release_password_123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ci_release_password_123' }}
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:bundleRelease --stacktrace
          else
            gradle :app:bundleRelease --stacktrace
          fi

      - name: Upload Signed Release AAB & R8 Mapping Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udhaar-release-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload to Google Play Internal Testing Track (Optional)
        if: env.PLAY_STORE_JSON_KEY != ''
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.jyotirmoyb.udhaar
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  # =========================================================================
  # 7. deploy-firebase (manual trigger): firebase deploy --only firestore:rules,firestore:indexes,hosting
  #    using CI token / service account secret, Spark-safe (zero functions, zero storage)
  # =========================================================================
  deploy-firebase:
    name: 7. Deploy Firebase (Spark Safe: Rules, Indexes, Hosting)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # [BLAZE-DISABLED START] reason: Cloud Functions and Cloud Storage deploy forbidden on Spark plan | restore: add functions,storage when upgrading to Blaze
      # - name: Deploy Cloud Functions & Storage to Firebase
      #   run: firebase deploy --only functions,storage
      # [BLAZE-DISABLED END]

      - name: Deploy Rules, Indexes & Hosting to Firebase Spark
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UDHAAR_PROD || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
            firebase deploy --only firestore:rules,firestore:indexes,hosting --non-interactive
            rm -f /tmp/firebase-sa.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only firestore:rules,firestore:indexes,hosting --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "Dry-run validation mode: zero secrets configured."
            firebase --version
            echo "Spark deployment config validated for firestore:rules, firestore:indexes, hosting."
          fi
