name: Udhaar Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: Unit Tests, Lint, ktlint & Release R8 Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 20 (Cloud Functions tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Cloud Functions & Security Rules unit tests
        working-directory: functions
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts
          node --test

      - name: Install and run ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod a+x ktlint
          ./ktlint "app/src/**/*.kt" \
            --disabled_rules=standard:no-wildcard-imports,standard:max-line-length,standard:function-naming,standard:filename,standard:backing-property-naming,standard:discouraged-comment-location,standard:import-ordering || true
          ./ktlint --version

      - name: Prepare ephemeral CI release signing key for R8 assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ci_release_password_123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ci_release_password_123' }}
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Udhaar CI, OU=Mobile, O=Udhaar, L=Kolkata, ST=WB, C=IN"
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android JVM & Robolectric Unit Tests
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: Run Android Lint
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:lintDebug --stacktrace
          else
            gradle :app:lintDebug --stacktrace
          fi

      - name: Build Release APK with R8 Minification & Resource Shrinking
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'ci_release_password_123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ci_release_password_123' }}
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload Lint Report & R8 Mapping Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udhaar-ci-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/mapping/release/
            app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
