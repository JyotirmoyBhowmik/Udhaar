# Udhaar Single Source of Truth for Android & Web Release Versioning
# Rules enforced by app/build.gradle.kts and verifyReleaseVersioning:
# - versionCode must be an integer >= minVersionCode (28) and monotonically increasing.
# - In CI runs with BUILD_NUMBER or GITHUB_RUN_NUMBER set, versionCode = max(versionCode, ciVersionCodeBase + runNumber).
# - versionName is derived from this same file (never falls back to "1.0.0").
versionCode=32
versionName=32.0
ciVersionCodeBase=100
minVersionCode=28
