<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Page Not Found — Udhaar</title>
  <meta name="description" content="The page you are looking for could not be found." />
  <meta name="theme-color" content="#064E3B" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/png" href="/assets/hero-3d-phone.png" />
  <link rel="stylesheet" href="/landing.css" />
  <style>
    .error-container {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-code {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 900;
      color: var(--primary-accent);
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 520px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="/" class="brand-logo" aria-label="Udhaar Home">
        <div class="brand-icon">U</div>
        <span>UDHAAR</span>
      </a>
      <div class="nav-right">
        <a class="btn-primary" href="/">Go to Home</a>
      </div>
    </div>
  </header>

  <main class="container error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-desc">
      The link you followed may be incorrect, expired, or the page may have been moved.
    </p>
    <a class="btn-primary" href="/">
      <span>←</span>
      <span>Back to Homepage</span>
    </a>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© 2026 Udhaar. All rights reserved.</span>
      <a href="/privacy.html">Privacy Policy</a>
    </div>
  </footer>
</body>
</html>
