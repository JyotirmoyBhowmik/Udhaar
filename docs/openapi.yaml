openapi: 3.1.0
info:
  title: Udhaar Platform v2 API
  version: 2.0.0
  description: >
    Production REST API specification for Udhaar Platform v2 (Web, Android, and Guest flows).
    Enforces RFC 9457 Problem Details for all errors, idempotency keys on state-mutating requests,
    W3C distributed tracing, and field-level envelope encryption.
servers:
  - url: https://app.udhaar.jyotirmoyb.com/api/v1
    description: Production Web App API (asia-south1)
  - url: https://udhaar.jyotirmoyb.com/api/v1
    description: Marketing & Guest Flow API (asia-south1)
  - url: http://127.0.0.1:5001/gen-lang-client-0216629575/asia-south1/api/v1
    description: Local Firebase Emulator Suite

paths:
  # =========================================================================
  # 1. Identity & Verification Endpoints
  # =========================================================================
  /auth/signup/start:
    post:
      summary: Start sign-up flow with mobile number
      operationId: startSignup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/AppCheckToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, locale, botCheckToken]
              properties:
                phoneNumber:
                  type: string
                  example: "+919876543210"
                  description: E.164 formatted mobile number (+91 India, +977 Nepal)
                locale:
                  type: string
                  enum: [en, hi, bn, as, ne]
                  default: en
                botCheckToken:
                  type: string
                  description: reCAPTCHA Enterprise or Play Integrity token
      responses:
        '200':
          description: Verification code dispatched via WhatsApp
          content:
            application/json:
              schema:
                type: object
                required: [flowId, channel, resendAfterSeconds]
                properties:
                  flowId:
                    type: string
                    format: uuid
                  channel:
                    type: string
                    enum: [WHATSAPP, SMS]
                  resendAfterSeconds:
                    type: integer
                    example: 30
        '400':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/ProblemDetails'

  /auth/otp/verify:
    post:
      summary: Verify 6-digit verification code
      operationId: verifyOtp
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flowId, code]
              properties:
                flowId:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: "482910"
      responses:
        '200':
          description: Code verified successfully
          content:
            application/json:
              schema:
                type: object
                required: [verified, flowToken]
                properties:
                  verified:
                    type: boolean
                    example: true
                  flowToken:
                    type: string
        '400':
          $ref: '#/components/responses/ProblemDetails'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/signup/email:
    post:
      summary: Submit email address during sign-up
      operationId: submitSignupEmail
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flowId, flowToken, email]
              properties:
                flowId:
                  type: string
                  format: uuid
                flowToken:
                  type: string
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        '200':
          description: Verification code sent to email
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendAfterSeconds:
                    type: integer
                    example: 30

  /auth/signup/complete:
    post:
      summary: Complete registration and establish user session
      operationId: completeSignup
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flowId, flowToken, displayName, acceptedTermsVersion, acceptedPrivacyVersion, isAge18Plus]
              properties:
                flowId:
                  type: string
                flowToken:
                  type: string
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 60
                acceptedTermsVersion:
                  type: string
                  example: "v2.0"
                acceptedPrivacyVersion:
                  type: string
                  example: "v2.0"
                isAge18Plus:
                  type: boolean
                  example: true
                allowWhatsAppReminders:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Account created and session established
          headers:
            Set-Cookie:
              schema:
                type: string
                description: __session HttpOnly cookie for Web clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  customToken:
                    type: string
                    description: Firebase Custom Token for Android clients

  /auth/signin/start:
    post:
      summary: Initiate sign-in via WhatsApp code
      operationId: startSignin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
      responses:
        '200':
          description: Uniform sign-in response (no enumeration leakage)
          content:
            application/json:
              schema:
                type: object
                properties:
                  flowId:
                    type: string
                  channel:
                    type: string
                  resendAfterSeconds:
                    type: integer

  # =========================================================================
  # 2. User Profile, Devices & Consents (/me)
  # =========================================================================
  /me:
    get:
      summary: Retrieve current authenticated profile
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      summary: Update profile preferences
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                locale:
                  type: string
                defaultCurrency:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /me/devices:
    get:
      summary: List registered active devices and sessions
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSession'

  /me/devices/{deviceId}:
    delete:
      summary: Revoke a specific device session
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Device session revoked

  # =========================================================================
  # 3. Synchronization Engine (/sync)
  # =========================================================================
  /sync/push:
    post:
      summary: Push batch of local mutations to server
      operationId: syncPush
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, changes]
              properties:
                deviceId:
                  type: string
                changes:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/SyncMutation'
      responses:
        '200':
          description: Sync results per change
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        syncId:
                          type: string
                        status:
                          type: string
                          enum: [ACCEPTED, CONFLICT, REJECTED]
                        serverRev:
                          type: integer
                        conflictDetails:
                          type: object

  /sync/pull:
    get:
      summary: Pull server delta changes since cursor
      operationId: syncPull
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncDelta'
                  nextCursor:
                    type: integer
                  hasMore:
                    type: boolean

  # =========================================================================
  # 4. Records & Events
  # =========================================================================
  /records:
    get:
      summary: List user records with cursor pagination
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerRecord'
                  nextCursor:
                    type: string
    post:
      summary: Create a new ledger record
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerRecord'

  /records/{id}:
    get:
      summary: Retrieve single record details
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerRecord'
    put:
      summary: Update record terms
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecordRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerRecord'

  /records/{id}/payments:
    post:
      summary: Append a partial repayment
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountPaise, paymentMode]
              properties:
                amountPaise:
                  type: integer
                  minimum: 100
                paymentMode:
                  type: string
                  enum: [UPI, CASH, BANK_TRANSFER]
                note:
                  type: string
      responses:
        '201':
          description: Payment logged and balance updated

  # =========================================================================
  # 5. Attachments & Proof Uploads
  # =========================================================================
  /attachments/upload-url:
    post:
      summary: Generate pre-signed Cloud Storage upload URL
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes, recordId]
              properties:
                fileName:
                  type: string
                mimeType:
                  type: string
                  enum: [image/webp, image/jpeg, image/png, application/pdf]
                sizeBytes:
                  type: integer
                  maximum: 5242880
                recordId:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  storagePath:
                    type: string
                  expiresInSeconds:
                    type: integer
                    example: 900

  # =========================================================================
  # 6. Privacy & DPDP Compliance
  # =========================================================================
  /privacy/export:
    post:
      summary: Request complete archive export of user data
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '202':
          description: Export archive generation initiated

  /privacy/delete:
    post:
      summary: Initiate account deletion with 30-day grace period
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '202':
          description: Account marked for deletion in 30 days

  # =========================================================================
  # 7. Hardened Capability Links & Guest Verification Flow (Stage S6)
  # =========================================================================
  /links/create:
    post:
      summary: Create a 30-day capability link for a ledger record
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordId]
              properties:
                recordId:
                  type: string
                expiresInDays:
                  type: integer
                  default: 30
      responses:
        '201':
          description: Capability link created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkId:
                    type: string
                  recordId:
                    type: string
                  rawToken:
                    type: string
                  guestUrl:
                    type: string
                  expiresAtMs:
                    type: integer

  /links/{recordId}:
    get:
      summary: Fetch sanitized record view using capability token
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - name: X-Guest-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sanitized record view returned successfully
        '403':
          description: Link expired or invalid capability token
        '429':
          description: IP rate limit exceeded or access locked

  /links/{recordId}/otp/request:
    post:
      summary: Request 6-digit WhatsApp OTP verification code
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification code dispatched via WhatsApp

  /links/{recordId}/otp/verify:
    post:
      summary: Verify WhatsApp OTP code with 5-attempt brute-force lockout
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Phone successfully verified
        '429':
          description: Too many failed attempts (15-minute lockout)

  /links/{recordId}/action:
    post:
      summary: Submit guest action (confirm, dispute, propose date, payment claim)
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [CONFIRM_RECORD, DISPUTE_RECORD, PROPOSE_DATE, SUBMIT_PAYMENT_CLAIM]
                payload:
                  type: object
      responses:
        '200':
          description: Guest action recorded with anti-replay guarantees

  /links/{recordId}/upload-proof:
    post:
      summary: Generate short-lived signed GCS PUT URL for payment proof (< 5MB)
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, sizeBytes]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, application/pdf]
                sizeBytes:
                  type: integer
                  maximum: 5242880
      responses:
        '200':
          description: Signed upload URL generated with length range headers

  /links/{recordId}/upgrade:
    post:
      summary: Bridge guest record into a newly created or authenticated user account
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawToken]
              properties:
                rawToken:
                  type: string
      responses:
        '200':
          description: Reciprocal record seamlessly created in user ledger without re-entering data

  # =========================================================================
  # 8. Reminders, Chat, Inbox, and Data Exports (Stage S7)
  # =========================================================================
  /reminders/policy:
    get:
      summary: Fetch user reminder policy and quiet hours
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Policy configuration returned
    put:
      summary: Update reminder policy and quiet hours
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Policy updated successfully

  /reminders/schedule:
    post:
      summary: Evaluate due dates and list pending reminders
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Evaluated reminders list

  /reminders/{recordId}/snooze:
    post:
      summary: Snooze or stop reminders for a record
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                snoozeDays:
                  type: integer
                stop:
                  type: boolean
      responses:
        '200':
          description: Snooze status updated

  /reminders/{recordId}/send:
    post:
      summary: Dispatch or generate reminder for a record
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reminder dispatched or wa.me URL returned

  /chat/threads:
    get:
      summary: List user chat threads
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: User chat threads list
    post:
      summary: Get or create a chat thread for a record
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordId]
      responses:
        '201':
          description: Thread created or returned

  /chat/threads/{threadId}/messages:
    get:
      summary: List messages in a thread
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message history returned
    post:
      summary: Send a message to a thread
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bodyText]
      responses:
        '201':
          description: Message dispatched

  /chat/threads/{threadId}/extension:
    post:
      summary: Respond to a due date extension request (ACCEPT/DECLINE)
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId, decision]
      responses:
        '200':
          description: Extension request processed

  /inbox:
    get:
      summary: List user inbox notifications
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Inbox items list

  /inbox/{inboxId}/action:
    post:
      summary: Approve or decline payment claim or date proposal
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: inboxId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
      responses:
        '200':
          description: Action executed and ledger updated

  /inbox/{inboxId}/read:
    post:
      summary: Mark inbox notification as read
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: inboxId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read

  /exports/csv:
    get:
      summary: Download complete ledger CSV export
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: CSV file stream

  /exports/statement:
    get:
      summary: View official statement of account (HTML printable)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Printable HTML statement

  /exports/full-backup:
    get:
      summary: Download full user data portability archive (JSON)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Complete data archive JSON

  # =========================================================================
  # 9. Stage S8: Admin Governance & Cost Controls
  # =========================================================================
  /admin/overview:
    get:
      summary: System overview metrics, active users, spend limits and circuit health
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: System overview metrics
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/users/lookup:
    post:
      summary: Masked user inspection by pseudonymized hash (zero access to ledger contents)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queryHash]
              properties:
                queryHash:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Masked user inspection record
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/users/{targetUid}/lock:
    post:
      summary: Lock or unlock a user account for abuse mitigation
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: targetUid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked, reason]
              properties:
                locked:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: User lock state updated
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/links/{recordId}/revoke:
    post:
      summary: Administrative emergency revocation of a capability guest link
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Guest link revoked
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/audit-logs:
    get:
      summary: Query immutable admin action audit log
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of admin audit logs
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/kill-switches:
    get:
      summary: Inspect current status of all dynamic kill switches
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Feature flags and kill switches status
    post:
      summary: Toggle an emergency kill switch
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flagName, enabled, reason]
              properties:
                flagName:
                  type: string
                enabled:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: Kill switch state updated

  /admin/circuits:
    get:
      summary: Inspect third-party provider spending and circuit breaker states
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Circuit breaker metrics

  /admin/circuits/reset:
    post:
      summary: Reset a tripped provider circuit breaker
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerName, reason]
              properties:
                providerName:
                  type: string
                newDailyLimit:
                  type: integer
                reason:
                  type: string
      responses:
        '200':
          description: Provider circuit breaker reset

  # =========================================================================
  # 10. Stage S8: DPDP Act 2023 Privacy Tools
  # =========================================================================
  /me/account:
    delete:
      summary: Request account deletion with immediate cryptographic DEK shredding
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Account marked for deletion with 30-day cooling period and key shredded

  /me/account/cancel-deletion:
    post:
      summary: Cancel account deletion within the 30-day cooling period
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Account restored to active status

  /me/consent:
    get:
      summary: View current data processing consent preferences
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: User consent preferences
    post:
      summary: Update or withdraw specific data processing consents
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                whatsappUpdates:
                  type: boolean
                optionalAnalytics:
                  type: boolean
      responses:
        '200':
          description: Consent preferences updated

  # =========================================================================
  # 11. Stage S9: Observability, Real User Monitoring (RUM) & Automated Backups
  # =========================================================================
  /telemetry/rum:
    post:
      summary: Ingest client Core Web Vitals (LCP, INP, CLS) and frontend error reports
      description: Unauthenticated endpoint accepting browser beacon submissions from PWA and guest portal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metricName:
                  type: string
                  enum: [LCP, INP, CLS, CLIENT_ERROR]
                value:
                  type: number
                  description: Numeric measurement (ms for LCP/INP, score for CLS)
                pageUrl:
                  type: string
                errorDetails:
                  type: object
                  properties:
                    message:
                      type: string
                    stack:
                      type: string
      responses:
        '204':
          description: Telemetry beacon recorded with zero content returned

  /telemetry/slo:
    get:
      summary: Query real-time SLI/SLO metrics, latency percentiles (p50, p95, p99) and availability
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: SLI metrics and SLO compliance status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [HEALTHY, AT_RISK]
                  sli:
                    type: object
                  sloTargets:
                    type: object
                  sloCompliance:
                    type: object
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/backups:
    get:
      summary: List point-in-time backup snapshots with SHA-256 manifests
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: List of available backup snapshots
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/backups/snapshot:
    post:
      summary: Trigger an on-demand point-in-time backup snapshot to Cloud Storage
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [INCREMENTAL, FULL]
                  default: INCREMENTAL
      responses:
        '201':
          description: Snapshot created and manifest sealed
        '400':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /admin/backups/{snapshotId}/verify:
    post:
      summary: Verify the SHA-256 cryptographic manifest integrity of a backup snapshot
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cryptographic integrity status of the snapshot
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /admin/backups/{snapshotId}/restore-drill:
    post:
      summary: Execute a staging disaster recovery restore simulation drill
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetStagingDatabase:
                  type: string
      responses:
        '200':
          description: Disaster recovery drill results and achieved RTO/RPO metrics
        '400':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __session
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
    AppCheckToken:
      name: X-Firebase-AppCheck
      in: header
      required: false
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema:
        type: string

  schemas:
    UserProfile:
      type: object
      properties:
        uid:
          type: string
        phoneNumberMasked:
          type: string
          example: "+91 98*** **210"
        emailMasked:
          type: string
          example: "u***r@example.com"
        displayName:
          type: string
        locale:
          type: string
        defaultCurrency:
          type: string

    DeviceSession:
      type: object
      properties:
        deviceId:
          type: string
        deviceType:
          type: string
          enum: [ANDROID, WEB, DESKTOP]
        lastActiveMs:
          type: integer
        cityLevelLocation:
          type: string
          example: "Mumbai, India"
        isCurrent:
          type: boolean

    LedgerRecord:
      type: object
      properties:
        id:
          type: string
        partyName:
          type: string
        counterpartyRole:
          type: string
          enum: [LENDER, BORROWER]
        principalAmountPaise:
          type: integer
        remainingAmountPaise:
          type: integer
        dueDateMs:
          type: integer
        status:
          type: string
          enum: [PENDING, CONFIRMED, DISPUTED, SETTLED]
        clientRevision:
          type: integer

    CreateRecordRequest:
      type: object
      required: [partyName, counterpartyRole, principalAmountPaise]
      properties:
        partyName:
          type: string
        partyPhone:
          type: string
        counterpartyRole:
          type: string
          enum: [LENDER, BORROWER]
        principalAmountPaise:
          type: integer
          minimum: 100
        dueDateMs:
          type: integer
        note:
          type: string
        upiId:
          type: string

    UpdateRecordRequest:
      type: object
      properties:
        partyName:
          type: string
        note:
          type: string
        dueDateMs:
          type: integer

    SyncMutation:
      type: object
      required: [entity, syncId, op, clientRev, hlc, idempotencyKey]
      properties:
        entity:
          type: string
          enum: [RECORD, PAYMENT, PERSON, PLAN]
        syncId:
          type: string
          format: uuid
        op:
          type: string
          enum: [INSERT, UPDATE, DELETE]
        fields:
          type: object
        clientRev:
          type: integer
        hlc:
          type: string
        idempotencyKey:
          type: string

    SyncDelta:
      type: object
      properties:
        seq:
          type: integer
        entity:
          type: string
        syncId:
          type: string
        op:
          type: string
        fields:
          type: object
        serverRev:
          type: integer

    ProblemDetails:
      type: object
      required: [type, title, status, code, detail, instance]
      description: RFC 9457 standard problem details object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          example: "ERR_OTP_EXPIRED"
        detail:
          type: string
        instance:
          type: string
        invalidParams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string

  responses:
    ProblemDetails:
      description: RFC 9457 Problem Details error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
